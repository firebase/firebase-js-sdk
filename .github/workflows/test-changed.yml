name: Test Modified Packages

on: pull_request

permissions:
  contents: read

env:
  # Bump Node memory limit
  NODE_OPTIONS: "--max_old_space_size=4096"

jobs:
  test-chrome:
    name: Test Packages With Changed Files in Chrome and Node
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          # This makes Actions fetch all Git history so run-changed script can diff properly.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node (22)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version: 22.23.2
      # firebase-tools has a minimum java version requirement
      - name: Set up Java (22)
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '22'
      - name: install Chrome stable
        run: |
          sudo apt-get update
          sudo apt-get install google-chrome-stable
      - name: Test setup and yarn install
        run: |
          cp config/ci.config.json config/project.json
          yarn
      - name: build
        run: yarn build:changed core
      - name: Run tests on changed packages
        run: xvfb-run yarn test:changed core

  test-firefox:
    name: Test Packages With Changed Files in Firefox
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node (22)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: install Firefox stable
        run: npx @puppeteer/browsers install firefox@stable
      - name: Test setup and yarn install
        env:
          CHROMEDRIVER_SKIP_DOWNLOAD: true
        run: |
          cp config/ci.config.json config/project.json
          yarn
      - name: build
        run: yarn build:changed core
      - name: Run tests on changed packages
        run: xvfb-run yarn test:changed core
        env:
          BROWSERS: 'Firefox'
          
          
  test-webkit:
    name: Test Packages With Changed Files in Webkit
    runs-on: macos-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node (22)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Test setup and yarn install
        env:
          CHROMEDRIVER_SKIP_DOWNLOAD: true
        run: |
          cp config/ci.config.json config/project.json
          yarn
          npx playwright install webkit
      - name: build
        run: yarn build:changed core
      - name: Run tests on changed packages
        run: yarn test:changed core
        env:
          BROWSERS: 'WebkitHeadless'
