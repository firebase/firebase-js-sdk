name: Test Auth

on: pull_request

permissions:
  contents: read

env:
  # make chromedriver detect installed Chrome version and download the corresponding driver
  DETECT_CHROMEDRIVER_VERSION: true
  # The default behavior of chromedriver uses the older Chrome download URLs. We need to override
  # the behavior to use the new URLs.
  CHROMEDRIVER_CDNURL: https://googlechromelabs.github.io/
  CHROMEDRIVER_CDNBINARIESURL: https://storage.googleapis.com/chrome-for-testing-public
  # Bump Node memory limit
  NODE_OPTIONS: "--max_old_space_size=4096"

jobs:
  test-chrome:
    name: Test Auth on Chrome and Node If Changed
    runs-on: ubuntu-latest
    steps:
      # install Chrome first, so the correct version of webdriver can be installed by chromedriver
      # when setting up the repo.
      - name: install Chrome stable
        run: |
          npx @puppeteer/browsers install chrome@stable
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          # This makes Actions fetch all Git history so run-changed script can diff properly.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node (22)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version: 22.23.2
      # firebase-tools has a minimum java version requirement
      - name: Set up Java (22)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '22'
      - name: Test setup and yarn install
        run: |
          cp config/ci.config.json config/project.json
          yarn
      - name: build
        run: yarn build:changed auth
      - name: Run tests on changed packages
        run: xvfb-run yarn test:changed auth --concurrency 1
  test-firefox:
    name: Test Auth on Firefox If Changed

    runs-on: ubuntu-latest

    steps:
      - name: install Firefox stable
        run: npx @puppeteer/browsers install firefox@stable
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          # This makes Actions fetch all Git history so run-changed script can diff properly.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node (22)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Test setup and yarn install
        env:
          CHROMEDRIVER_SKIP_DOWNLOAD: true
        run: |
          cp config/ci.config.json config/project.json
          yarn
      - name: build
        run: yarn build:changed auth
      - name: Run tests on auth changed packages
        run: xvfb-run yarn test:changed auth --concurrency 1
        env:
          BROWSERS: 'Firefox'

  test-webkit:
    name: Test Auth on Webkit if Changed
    runs-on: macos-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node (22)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Test setup and yarn install
        env:
          CHROMEDRIVER_SKIP_DOWNLOAD: true
        run: |
          cp config/ci.config.json config/project.json
          yarn
          npx playwright install webkit
      - name: build
        run: yarn build:changed auth
      - name: Run tests on changed packages
        run: yarn test:changed auth --concurrency 1
        env:
          BROWSERS: 'WebkitHeadless'
